plugins {
    id 'java'
}

group = 'dev.dialogmenu'
version = providers.gradleProperty('version').get()

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.skriptlang.org/releases' }
}

def localClasspath = System.getenv('DIALOGMENU_LOCAL_CLASSPATH')
dependencies {
    if (localClasspath) {
        compileOnly files(localClasspath.split(java.io.File.pathSeparator).collect { file(it) })
    } else {
        compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
        compileOnly('com.github.SkriptLang:Skript:2.16.2') {
            transitive = false
        }
    }
    testImplementation files(configurations.compileClasspath)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveFileName = "DialogMenu-${project.version}.jar"
}

// Keep behavioral regressions part of the standard build without a test-framework dependency.
tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.dialogmenu.RegressionTests'
    args layout.projectDirectory.asFile.absolutePath
    jvmArgs '-Djava.awt.headless=true'
}

tasks.named('check') {
    dependsOn tasks.named('regressionTest')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// The executable suite above is the test runner; no JUnit/TestNG engine is required.
tasks.named('test') {
    dependsOn tasks.named('regressionTest')
    enabled = false
}
